fidelity:
  divergences: >-
    The null-cone divisibility step uses the Hilbert Nullstellensatz and
    squarefreeness. The varying-shell proof applies the necessary-moment
    argument directly on each subannulus. In the sufficiency proof, finite
    solid and Kelvin modes approximate on slightly larger compact sets by
    spherical polynomial approximation and a maximum principle. A cutoff
    energy identity gives the L² gradient approximation needed to pass
    to the two test limits successively. The original proof uses classical
    spherical-harmonic series with uniform convergence of first derivatives.
