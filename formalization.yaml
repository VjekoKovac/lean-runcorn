version: v0.4
project:
  name: "A converse to generalized Runcorn's theorem"
  description: >-
    Fix an integer n ≥ 2 and real radii 0 < r₋ < r₊. Write S = {x ∈ ℝⁿ : r₋ < |x| < r₊},
    A(a,b) = {x ∈ ℝⁿ : a ≤ |x| ≤ b}, and S(r) = {x ∈ ℝⁿ : |x| = r}.
    A test pair consists of complex harmonic functions u on {|x| < r₊} and v on
    {|x| > r₋}, with v(x) → 0 as |x| → ∞. Write B(u,v) = ∇u · ∇v for the
    complex bilinear dot product.

    Theorem 1 (varying annuli). For every continuous f : S → ℂ, the following
    three conditions are equivalent. (i) For every r₋ < a < b < r₊ and every
    test pair, the volume integral of f B(u,v) over A(a,b) is zero.
    (ii) For every r₋ < r < r₊ and every test pair, the surface integral of
    f B(u,v) over S(r) is zero. (iii) In dimensions n ≥ 3, f is radial on S.
    In dimension n = 2, there exist continuous functions g₋₁, g₀, g₁ from
    (r₋,r₊) to ℂ such that f(r cos θ, r sin θ) =
    g₋₁(r) exp(−iθ) + g₀(r) + g₁(r) exp(iθ) for every r ∈ (r₋,r₊) and θ ∈ ℝ.

    Theorem 2 (fixed annulus). Fix r₋ < a < b < r₊. In every degree k ≥ 0,
    choose any orthogonal basis (Yₖⱼ)ⱼ of the complex spherical harmonics of
    degree k on the unit sphere, with respect to surface area. For every
    f ∈ L²(A(a,b), dV; ℂ), the volume integral of f B(u,v) over A(a,b) is zero
    for every test pair if and only if there exist coefficients
    gₖⱼ ∈ L²([a,b], r^(n−1) dr; ℂ) with both of the following properties.
    The sums over 0 ≤ k < N and all basis indices j of gₖⱼ(|x|) Yₖⱼ(x/|x|)
    converge to f in L²(A(a,b), dV) as N → ∞. For each k and j,
    ∫ₐᵇ gₖⱼ(r) r^m r^(n−1) dr = 0 for every exponent m in the following ranges.
    In dimension n = 2 and degree k ≥ 2, m = 2ℓ−k for integers 0 ≤ ℓ ≤ k−2.
    In dimensions n ≥ 3 and degree k ≥ 1, m = 2ℓ−k−n+2 for integers
    0 ≤ ℓ ≤ k−1. The exponent set is empty for k = 0 in every dimension and
    for k = 1 in dimension two.
  authors: ["Vjekoslav Kovač", "Ivica Smolić"]
  responsible_maintainers: ["Vjekoslav Kovač"]
  license: Apache-2.0
